[tool.ruff]
required-version = "0.17.0"
target-version = "py310"
line-length = 100
extend-exclude = ["venv", ".tmp"]
cache-dir = ".tmp/ruff_cache"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --basetemp=.tmp/pytest-basetemp"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ponto_eletronico.state_store"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
